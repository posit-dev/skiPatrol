# Publish The Piste Guide to R and Snowflake (Quarto book) to GitHub Pages.
# Source: guide/Piste_Guide_to_R_and_Snowflake/ (synced from monorepo guide/).
#
# Publishes the CURATED SUBSET, not the whole book: --profile publish selects
# the chapters in _quarto-publish.yml (setup and core skiLift/skiPatrol usage)
# and project.render there keeps the held-back chapters out of _site entirely,
# so they are not reachable by direct URL either. A plain `quarto render`
# locally still builds the full book -- see _quarto-full.yml.
#
# Repo setup: the Setup Pages step below passes enablement: true and this
# workflow already holds `pages: write`, so it should turn Pages on by itself
# on first run. Untested -- nothing has ever been pushed to posit-dev/skiPatrol
# (P1-01 hold). If it fails, fall back to Settings -> Pages -> Build and
# deployment -> GitHub Actions.

name: Publish Guide to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'guide/Piste_Guide_to_R_and_Snowflake/**'
      - 'guide/requirements.txt'
      - '.github/workflows/publish-guide.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-skipatrol-guide
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'posit-dev/skiPatrol'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: guide/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r guide/requirements.txt

      - name: Set up Quarto
        run: |
          wget -q "https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.43/quarto-1.6.43-linux-amd64.deb" -O quarto.deb
          sudo dpkg -i quarto.deb
          rm quarto.deb
          quarto --version

      - name: Render Quarto book (curated subset)
        run: |
          cd guide/Piste_Guide_to_R_and_Snowflake
          quarto render --to html --no-execute --profile publish

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: guide/Piste_Guide_to_R_and_Snowflake/_site

  deploy:
    if: github.repository == 'posit-dev/skiPatrol'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
