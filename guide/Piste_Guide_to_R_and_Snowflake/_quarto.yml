project:
  type: book
  output-dir: _site
  post-render:
    - scripts/copy_vignette_html_to_site.sh

# Chapter lists live in the profiles, not in this file -- see _quarto-full.yml
# for why. This default keeps a bare `quarto render` building the complete book.
profile:
  default: full

website:
  site-url: https://posit-dev.github.io/skiPatrol/

book:
  title: "The Piste Guide to R and Snowflake"
  subtitle: "Working with skiLift and skiPatrol"
  author:
    - name: "Simon Field"
      url: "https://www.linkedin.com/in/fieldy6961/"
  date: "2026-05-29"
  search: true
  repo-url: https://github.com/posit-dev/skiPatrol
  repo-subdir: guide/Piste_Guide_to_R_and_Snowflake
  repo-actions: [edit, issue]

  sidebar:
    style: docked
    search: true


format:
  html:
    theme:
      light: [cosmo, _theme/snowflake-light.scss]
      dark:  [darkly, _theme/snowflake-dark.scss]
    include-after-body:
      - file: _theme/sidebar-toggle-include.html
    code-fold: false
    code-tools: true
    code-copy: true
    code-line-numbers: true
    toc: true
    toc-depth: 3
    number-sections: true
    highlight-style: github
    open-graph:
      title: "The Piste Guide to R and Snowflake"
      description: "Practical guide to R on Snowflake — platform primer, RStudio, Posit, VS Code, Workspace, skiLift, and skiPatrol."
      site-name: "posit-dev"
    description: "End-to-end guide for R users — Snowflake platform basics, desktop IDEs, Workspace Notebooks, DBI connectivity, and the skiPatrol ML platform."

execute:
  freeze: auto
  error: false
  warning: false

jupyter: python3

metadata:
  keywords: [snowflake, R, RStudio, Posit, VS Code, workspace notebooks, skiPatrol, skiLift, mlops]
